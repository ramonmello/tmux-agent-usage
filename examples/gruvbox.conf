# Optional format only: no font installation and no status-left/right changes.
# The terminal font must supply U+E0B6 and U+E0B4 (Powerline rounded caps).
# CC/CX are text labels, not private-use logos. Exact hex colors need truecolor.
set -g @example-agent-usage-gruvbox-flags "--style-normal 'fg=#fbf1c7' --style-high 'fg=#fabd2f' --style-critical 'fg=#fb4934' --style-muted 'fg=#a89984' --style-reset-soon 'fg=#b8bb26'"
set -g @example-agent-usage-gruvbox "#[fg=#d97757,bg=default]#[fg=#ffffff,bg=#d97757]CC #[fg=#d97757,bg=#3c3836]#[fg=#fbf1c7,bg=#3c3836] #(tmux-agent-usage status claude #{@example-agent-usage-gruvbox-flags}) #[fg=#3c3836,bg=default] #[fg=#000000,bg=default]#[fg=#ffffff,bg=#000000]CX #[fg=#000000,bg=#3c3836]#[fg=#fbf1c7,bg=#3c3836] #(tmux-agent-usage status codex #{@example-agent-usage-gruvbox-flags}) #[fg=#3c3836,bg=default]"
