# Synthetic consumer after migration; TPM dispatch is replaced by a local fixture.
unbind C-b
set -g prefix C-a
source-file ~/.config/tmux/tmux.remap.conf
set -g default-terminal "tmux-256color"
set -g status-position top
set -g base-index 1
set -g mouse on
set -g @plugin 'ramonmello/tmux-agent-usage#v0.1.0'
bind -n MouseDown1Status {
  if -F '#{||:#{==:#{mouse_status_range},claude},#{==:#{mouse_status_range},codex}}' {
    run-shell -b "#{E:@agent-usage-popup-command}"
  } {
    switch-client -t =
  }
}

source-file ~/.config/tmux/theme.conf
run '~/.config/tmux/plugins/tpm/tpm'
