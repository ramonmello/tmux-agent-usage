# Synthetic consumer: usage presentation and geometry only; no fonts or logos are bundled.
set -g status-left-length 40
set -g status-right-length 120
set -g status 2
set -gF status-format[1] ""
# The theme owns logos, caps and mouse ranges; the plugin replaces only bodies.
# To remove/reorder an agent, edit the pills below and @agent-usage-agents.
set -g @agent-usage-bin 'tmux-agent-usage'
set -g @agent-usage-popup-key 'A'
set -g @agent-usage-agents 'claude codex'
set -g @agent-usage-claude-resets 'on'
set -g @agent-usage-style-normal 'fg=#fbf1c7'
set -g @agent-usage-style-high 'fg=#fabd2f'
set -g @agent-usage-style-critical 'fg=#fb4934'
set -g @agent-usage-style-muted 'fg=#a89984'
set -g @agent-usage-style-reset-soon 'fg=#b8bb26'
set -g @agent-usage-popup-text '#fbf1c7'
set -g @agent-usage-popup-muted '#a89984'
set -g @agent-usage-popup-dim '#504945'
set -g @agent-usage-popup-ok '#b8bb26'
set -g @agent-usage-popup-high '#fabd2f'
set -g @agent-usage-popup-critical '#fb4934'
set -g @agent-usage-popup-accent '#83a598'
set -g @agent-usage-popup-border 'fg=#665c54'
set -g status-right "#[range=user|claude]#[fg=#d97757,bg=default]#[fg=#ffffff,bg=#d97757]\U00100006 #[fg=#d97757,bg=#3c3836]#[fg=#fbf1c7,bg=#3c3836] #{agent_usage_claude} #[fg=#3c3836,bg=default]#[range=right] #[range=user|codex]#[fg=#000000,bg=default]#[fg=#ffffff,bg=#000000]\U00100007 #[fg=#000000,bg=#3c3836]#[fg=#fbf1c7,bg=#3c3836] #{agent_usage_codex} #[fg=#3c3836,bg=default]#[range=right] #[fg=#3c3836,bg=default]#[fg=#fbf1c7,bg=#3c3836,nobold] %a %d %b #[fg=#a89984]·#[fg=#fbf1c7] %H:%M #[fg=#3c3836,bg=default]#{?client_prefix, #[fg=#cc241d,bg=default]#[fg=#1e2021,bg=#cc241d]\U00100001 #[fg=#cc241d,bg=#3c3836]#[fg=#fbf1c7,bg=#3c3836] PREFIX #[fg=#3c3836,bg=default],}"
