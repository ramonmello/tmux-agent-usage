# Synthetic consumer; no plugin manager or personal configuration.
unbind C-b
set -g prefix C-a
source-file ~/.config/tmux/tmux.remap.conf
set -g default-terminal "tmux-256color"
set -g status-position top
set -g base-index 1
set -g mouse on
bind -n MouseDown1Status {
  if -F '#{||:#{==:#{mouse_status_range},claude},#{==:#{mouse_status_range},codex}}' {
    run-shell -b "#{E:@agent-usage-popup-command}"
  } {
    switch-client -t =
  }
}

source-file ~/.config/tmux/theme.conf

# Local plugin, using the existing external executable selected by the theme.
run '~/.config/tmux/agent-usage/agent-usage.tmux'
