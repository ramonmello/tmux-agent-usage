{
  "name": "Prepare release candidate",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "tag": {
          "description": "Existing tag matching Cargo.toml (for example v0.1.0)",
          "required": true,
          "type": "string"
        }
      }
    }
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "source": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 5,
      "outputs": {
        "commit": "${{ steps.source.outputs.commit }}"
      },
      "env": {
        "RELEASE_TAG": "${{ inputs.tag }}",
        "WORKFLOW_REF": "${{ github.ref }}",
        "WORKFLOW_SHA": "${{ github.sha }}"
      },
      "steps": [
        {
          "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
          "with": {
            "persist-credentials": false,
            "ref": "${{ inputs.tag }}",
            "fetch-depth": 0
          }
        },
        {
          "name": "Verify tag and source",
          "id": "source",
          "shell": "bash",
          "run": "set -euo pipefail\ntest \"$WORKFLOW_REF\" = \"refs/tags/$RELEASE_TAG\"\ncommit=$(python3 scripts/release.py source \"$RELEASE_TAG\")\ntest \"$commit\" = \"$WORKFLOW_SHA\"\necho \"commit=$commit\" >> \"$GITHUB_OUTPUT\""
        }
      ]
    },
    "checks": {
      "needs": "source",
      "uses": "./.github/workflows/ci.yml",
      "with": {
        "ref": "${{ needs.source.outputs.commit }}"
      }
    },
    "build": {
      "needs": [
        "source",
        "checks"
      ],
      "runs-on": "${{ matrix.platform.runner }}",
      "timeout-minutes": 20,
      "strategy": {
        "fail-fast": false,
        "matrix": {
          "platform": [
            {
              "runner": "macos-15",
              "target": "aarch64-apple-darwin"
            },
            {
              "runner": "macos-15-intel",
              "target": "x86_64-apple-darwin"
            },
            {
              "runner": "ubuntu-24.04",
              "target": "x86_64-unknown-linux-musl"
            },
            {
              "runner": "ubuntu-24.04-arm",
              "target": "aarch64-unknown-linux-musl"
            }
          ]
        }
      },
      "env": {
        "CARGO_BUILD_TARGET": "${{ matrix.platform.target }}",
        "CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER": "musl-gcc",
        "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER": "musl-gcc",
        "MACOSX_DEPLOYMENT_TARGET": "11.0",
        "RUST_BACKTRACE": "1",
        "RELEASE_TAG": "${{ inputs.tag }}"
      },
      "steps": [
        {
          "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
          "with": {
            "persist-credentials": false,
            "ref": "${{ needs.source.outputs.commit }}",
            "fetch-depth": 0
          }
        },
        {
          "name": "Install integration tools",
          "shell": "bash",
          "run": "set -euo pipefail\nif [[ \"$RUNNER_OS\" == macOS ]]; then\n  brew list tmux >/dev/null 2>&1 || brew install tmux\nelse\n  sudo apt-get update\n  sudo apt-get install -y tmux musl-tools locales\n  sudo locale-gen en_US.UTF-8\nfi"
        },
        {
          "name": "Install Rust toolchain",
          "shell": "bash",
          "env": {
            "CHECK_TOOLCHAIN": "1.88.0"
          },
          "run": "set -euo pipefail\nrustup toolchain install \"$CHECK_TOOLCHAIN\" --profile minimal --component rustfmt,clippy --target \"$CARGO_BUILD_TARGET\"\necho \"RUSTUP_TOOLCHAIN=$CHECK_TOOLCHAIN\" >> \"$GITHUB_ENV\""
        },
        {
          "name": "Build tagged artifact and verify ABI",
          "shell": "bash",
          "run": "python3 scripts/release.py build \"$RELEASE_TAG\" \"$CARGO_BUILD_TARGET\" \"$RUNNER_TEMP/release-assets\""
        },
        {
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "candidate-${{ matrix.platform.target }}",
            "path": "${{ runner.temp }}/release-assets/*",
            "if-no-files-found": "error",
            "retention-days": 7
          }
        }
      ]
    },
    "assemble": {
      "needs": [
        "source",
        "build"
      ],
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 10,
      "permissions": {
        "contents": "read",
        "id-token": "write",
        "attestations": "write"
      },
      "env": {
        "RELEASE_TAG": "${{ inputs.tag }}"
      },
      "steps": [
        {
          "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
          "with": {
            "persist-credentials": false,
            "ref": "${{ needs.source.outputs.commit }}",
            "fetch-depth": 0
          }
        },
        {
          "uses": "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093",
          "with": {
            "pattern": "candidate-*",
            "path": "${{ runner.temp }}/inputs"
          }
        },
        {
          "name": "Verify all four artifacts and write SHA256SUMS",
          "shell": "bash",
          "run": "python3 scripts/release.py assemble \"$RELEASE_TAG\" \"$RUNNER_TEMP/inputs\" \"$RUNNER_TEMP/candidate\""
        },
        {
          "uses": "actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be",
          "id": "attest",
          "with": {
            "subject-path": "${{ runner.temp }}/candidate/*"
          }
        },
        {
          "name": "Include the signed provenance bundle",
          "shell": "bash",
          "env": {
            "BUNDLE": "${{ steps.attest.outputs.bundle-path }}"
          },
          "run": "cp \"$BUNDLE\" \"$RUNNER_TEMP/candidate/provenance.sigstore.json\""
        },
        {
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "tmux-agent-usage-${{ inputs.tag }}",
            "path": "${{ runner.temp }}/candidate/*",
            "if-no-files-found": "error",
            "retention-days": 30
          }
        }
      ]
    }
  }
}
